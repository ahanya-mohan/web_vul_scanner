[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web_vul_scanner"
version = "0.1.0"
description = "An educational web vulnerability scanner for authorized testing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
# The bundled target and the test/dev toolchain.
dev = [
    "flask>=3.0",
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
web_vul_scanner = "web_vul_scanner.cli:main"

[tool.setuptools.packages.find]
include = ["web_vul_scanner*", "targets*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
